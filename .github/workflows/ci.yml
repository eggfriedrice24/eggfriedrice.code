name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A stale snapshot fails instead of being rewritten.
  INSTA_UPDATE: "no"

# Every job except `ghostty` is Zig-free. `test-leaf` and `ghostty` guard on the crate
# directory, as they did while the crates of milestone 1 landed.
#
# Each Swatinem/rust-cache step names its cache with `shared-key`, one per distinct
# build (the jobs build different features or profiles, so they cannot share one), and
# saves only on main: a pull request restores the cache of main and never spends time
# saving its own. The cache holds the dependencies only; the workspace crates build in
# every run.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli@1.50.3
      - run: cargo fmt --all --check
      - run: typos

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tidy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask tidy
      - run: cargo xtask deps
      # docs/config.md and docs/config.schema.json come from efr-config; a key changed
      # without `cargo xtask config-docs` fails here.
      - run: cargo xtask config-docs --check
      - name: negative cargo tree checks
        shell: bash
        # The same rules as xtask/src/deps.rs, through a second implementation, so the
        # two check each other.
        run: |
          set -euo pipefail
          members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')"
          is_member() { grep -qx "$1" <<<"$members"; }
          fail=0
          forbid() {
            local from="$1" to="$2"
            if ! is_member "$from"; then
              echo "skip: $from does not exist yet"
              return
            fi
            if cargo tree -p "$from" -e normal --all-features --prefix none --format '{p}' \
                | awk '{print $1}' | grep -qx "$to"; then
              echo "::error::forbidden edge $from -> $to"
              fail=1
            else
              echo "ok: $from does not reach $to"
            fi
          }
          forbid efr-tools efr-permissions
          forbid efr-provider-openai efr-oauth-openai
          forbid efr-provider-anthropic efr-oauth-openai
          forbid efr-conversation efr-shell
          forbid efr-conversation efr-transport
          forbid efr-transport efr-store
          forbid efr-protocol tokio
          forbid efr-test-support efr-daemon
          forbid efr-patch tokio
          only_parent() {
            local dep="$1" owner="$2" parents
            parents="$(cargo tree --workspace --all-features -e normal -i "$dep" --depth 1 \
                --prefix none --format '{p}' 2>/dev/null | tail -n +2 | awk '{print $1}' | sort -u || true)"
            for parent in $parents; do
              if [[ "$parent" != "$owner" ]] && is_member "$parent"; then
                echo "::error::only $owner may depend on $dep, found $parent"
                fail=1
              fi
            done
            echo "ok: direct workspace parents of $dep: ${parents:-none}"
          }
          only_parent libghostty-vt efr-screen-ghostty
          only_parent rusqlite efr-store
          exit "$fail"

  # Clippy and rustdoc in one target directory: the docs reuse the dependency metadata
  # that clippy checked, so the second step builds only the workspace crates. The docs
  # run after a clippy failure too, so one run reports both. `just lint` runs both, as
  # `clippy` and `doc-check`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: clippy
        run: cargo clippy --workspace --exclude efr-screen-ghostty --all-targets -- -D warnings
      - if: ${{ success() || steps.clippy.outcome == 'failure' }}
        run: cargo doc --workspace --exclude efr-screen-ghostty --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # The leaf crates alone: cargo unifies features only over the packages it builds, so
  # here they build and run against their own dependency features (serde_json without
  # unbounded_depth, rustix without stdio, libc without extra_traits), not the ones the
  # daemon side turns on in `build`. A leaf test that compiles or passes only because of
  # a feature another crate enables fails here and nowhere else.
  test-leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-leaf
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: leaf crates
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for crate in efr-stdx efr-protocol efr-store efr-credentials efr-permissions \
              efr-scope efr-holder efr-http efr-screen efr-provider efr-test-support \
              efr-screen-vt100 efr-patch; do
            if [[ -d "crates/$crate" ]]; then args+=(-p "$crate"); fi
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "no leaf crates yet; nothing to run"
            exit 0
          fi
          cargo nextest run "${args[@]}" --lib --tests --profile ci

  # The test binaries of every member except the ghostty screen, built once and shared
  # with `test-full`, `shell` and `sandbox` as a nextest archive. It holds the test
  # binaries, efr and efrd (for CARGO_BIN_EXE_efr), the build script outputs and the
  # metadata nextest needs; `just test-full` builds the same set.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - run: >-
          cargo nextest archive --workspace --exclude efr-screen-ghostty
          --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      # The archive is zstd already; zipping it again would only cost time.
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # NOTE: `test-full`, `shell` and `sandbox` run the archive of `build` and neither
  # install Rust nor compile. The archive is unpacked into the checkout, so target/ sits
  # at the same absolute path as in `build` (every runner checks out to the same
  # directory) and the paths compiled into the tests (CARGO_MANIFEST_DIR,
  # CARGO_BIN_EXE_efr) hold.
  # INSTA_WORKSPACE_ROOT spares insta the `cargo metadata` call it would make without a
  # toolchain to find the workspace; it names the same root.
  test-full:
    needs: build
    runs-on: ubuntu-latest
    env:
      INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - run: >-
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          --workspace-remap . --extract-to . --profile ci

  shell:
    needs: build
    runs-on: ubuntu-latest
    env:
      INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # The tests of the four packages that `-p efr-shell -p efr-cli -p efr-daemon
      # -p efr-test-daemon` selected before the archive. They are now built with the
      # features of the whole workspace, as in `test-full`, not only the ones the four
      # packages turn on; `hack` still checks each package's own feature sets. efr-daemon
      # is built with local-pty, which the shell_ tests over a TestDaemon need for a real
      # zsh. As in `just test-shell`; `just test-shell-ubuntu` runs this job in a
      # container set up like this runner.
      - run: >-
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
          --workspace-remap . --extract-to . --profile ci
          -E 'package(efr-shell) | package(efr-cli) | package(efr-daemon) | package(efr-test-daemon)'
        env:
          EFR_TEST_ZSH: "1"

  # The tests of `just test-sandbox` on real bwrap, Landlock ABI 9 and seccomp. The
  # runner's kernel is older than 7.1 and its AppArmor blocks unprivileged user
  # namespaces, so .github/sandbox-vm.sh boots the kernel that it pins with virtme-ng in
  # QEMU and runs the tests of the build job's archive inside, where a skipped test
  # fails. `just test-sandbox-vm` runs the same step in a container set up like this
  # runner.
  sandbox:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # GitHub gives public repositories KVM on its standard Linux runners, but only the
      # kvm group may open /dev/kvm (the udev rule of GitHub's changelog of 2024-04-02).
      # Without KVM the job fails here: QEMU alone is too slow for the suite.
      - name: open /dev/kvm to the runner user
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm does not exist on this runner; the sandbox VM needs KVM"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: .github/sandbox-vm.sh tools
      # The corpus rows that run cargo use the pinned toolchain, read from
      # rust-toolchain.toml. The guest sees it in the runner's ~/.rustup.
      - run: rustup toolchain install
      - run: .github/sandbox-vm.sh bwrap
      - run: .github/sandbox-vm.sh kernel "$RUNNER_TEMP/kernel"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # Unpacked into the checkout, as in `test-full`; the step summary gets the
      # kernel, the Landlock ABI and the launch cost table.
      - run: >-
          .github/sandbox-vm.sh run "$RUNNER_TEMP/kernel"
          "$RUNNER_TEMP/nextest-archive.tar.zst" . .

  ghostty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check for the ghostty screen crate
        id: present
        shell: bash
        run: |
          if [[ -d crates/efr-screen-ghostty ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "efr-screen-ghostty does not exist yet; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.present.outputs.run == 'true'
        run: rustup toolchain install
      # Zig 0.16.0 exactly: the pin triple in docs/ghostty-pin.md.
      # NOTE: every release of setup-zig up to v2.2.1, on GitHub and on Codeberg, still
      # declares node20; GitHub runs it on Node 24 and warns. Move to the first release
      # that declares node24.
      - if: steps.present.outputs.run == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Caches the ghostty clone and the zig build output under target/. This job keeps
      # a build of its own: the archive of `build` would need Zig there too, and the
      # zig build of ghostty would then hold up every test job.
      - if: steps.present.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ghostty
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.present.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      # The daemon half joins once efr-daemon exists (milestone 1, step 5), as in `just test-ghostty`.
      - if: steps.present.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d crates/efr-daemon ]]; then
            cargo nextest run -p efr-screen-ghostty -p efr-daemon --features efr-daemon/screen-ghostty --profile ci
          else
            cargo nextest run -p efr-screen-ghostty --profile ci
          fi

  # The slowest check, split into three runners by cargo-hack's own partitions; the
  # three together run exactly the commands of `just hack`. Each partition checks other
  # feature sets, so each keeps a cache of its own.
  hack:
    name: hack (${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hack-${{ matrix.partition }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      # efr-daemon's screen-ghostty feature pulls in the ghostty crate even though it is
      # excluded, and its build needs Zig; the ghostty job covers that feature. As in
      # `just hack`.
      - run: >-
          cargo hack check --feature-powerset --workspace --exclude efr-screen-ghostty
          --exclude-features screen-ghostty --partition ${{ matrix.partition }}/3
