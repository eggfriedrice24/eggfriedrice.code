[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[profile.ci]
retries = 0
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"

# The launch cost gate of efr-sbx runs 2100 sandbox launches one after the other with
# EFR_TEST_SBX_GATE=1. In the VM of CI's sandbox job, a launch costs about 30 ms, so
# the test needs more than the default minute. Each call has its own limit of 120 s.
# The corpus run of efr-sbx compares about 40 routine lines in the sandbox with the same
# lines outside it, cargo builds among them. Under nested virtualization in the same VM
# it takes more than a minute too.
#
# The cost tests run one at a time: each one measures launch times, so a cost test that
# runs beside another one measures that one's load too. With EFR_TEST_SBX_GATE=1, the
# proxy and the downloads cost tests make 4000 and 3000 launches; in the CI VM, at about
# 80 ms per launch, one of them needs more than five minutes.
[[profile.default.overrides]]
filter = 'binary_id(efr-sbx::it) & test(/^cost::/)'
test-group = "sbx-cost"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'binary_id(efr-sbx::it) & test(/^corpus::/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The cost test of efr-snapshot builds a fixture of this repository's size with a
# history of 1000 commits, then takes about 70 snapshots; in a busy full run or a slow
# runner that needs more than the default minute.
[[profile.default.overrides]]
filter = 'binary_id(efr-snapshot::it) & test(/^cost::/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The search benches (`just bench-search`) measure times: they run one at a time, and a
# bench that builds a corpus of 20,000 or 50,000 turns needs more than the default
# minute.
[[profile.default.overrides]]
filter = 'test(/bench_search_/)'
test-group = "search-bench"
slow-timeout = { period = "60s", terminate-after = 10 }

# The perf benches (`just bench-perf`) measure times: they run one at a time, and a
# bench that builds its corpus file for the first time needs more than the default
# minute.
[[profile.default.overrides]]
filter = 'test(/bench_perf_/)'
test-group = "perf-bench"
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
shell = { max-threads = 1 }
sbx-cost = { max-threads = 1 }
search-bench = { max-threads = 1 }
perf-bench = { max-threads = 1 }

# Tests that drive a real zsh share terminal state and run one at a time: efr-shell's
# e2e_ tests, the shell_ tests over a TestDaemon, and efr-daemon's own e2e_ test. The
# shell_ tests sit in modules of efr-daemon's one test binary (`shell_tool::shell_...`),
# so the name is matched after `::`; the binary is named because unit tests in src/ such
# as `tools::tests::shell_...` need no zsh.
[[profile.default.overrides]]
filter = 'package(efr-shell) & test(/^e2e_/) | package(efr-test-daemon) & test(/^shell_/) | binary_id(efr-daemon::it) & test(/::shell_/) | package(efr-daemon) & test(/::e2e_/)'
test-group = "shell"
