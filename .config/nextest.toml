[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[profile.ci]
retries = 0
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"

[test-groups]
shell = { max-threads = 1 }

# Tests that drive a real zsh share terminal state and run one at a time: efr-shell's
# e2e_ tests, the shell_ tests over a TestDaemon, and efr-daemon's own e2e_ test.
[[profile.default.overrides]]
filter = 'package(efr-shell) & test(/^e2e_/) | package(efr-test-daemon) & test(/^shell_/) | package(efr-daemon) & (test(/^shell_/) | test(/::e2e_/))'
test-group = "shell"
