# cargo-deny 0.20 configuration. The models are goose's `yanked = "deny"` and atuin's
# explicit licence allow list.

[graph]
all-features = true
# Only the release targets (dist plan: linux gnu x86_64 and aarch64). Without this,
# macOS, Android and wasm-only edges of keyring and reqwest enter the graph.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = [
  # bincode 1.3.3 is unmaintained, not vulnerable: its team stopped development and
  # calls 1.3.3 complete. syntect 5.3.0 and two-face load their embedded grammar and
  # theme dumps with it, and no upgrade exists. Open question, see
  # docs/adr/0005-syntax-highlighting-engine.md: revisit syntect or move to tree-sitter.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is complete and unmaintained, not vulnerable; syntect and two-face need it for their grammar dumps" },
  # zvariant, zbus_names and zvariant_derive are unmaintained, not vulnerable: their code
  # moved into zbus 6. efr-credentials gets them through keyring 4.2.0, secret-service
  # 5.2.0 and zbus 5, and no keyring or secret-service release uses zbus 6 yet. Remove
  # these three when keyring moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is unmaintained, not vulnerable; keyring and secret-service still need zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is unmaintained, not vulnerable; keyring and secret-service still need zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is unmaintained, not vulnerable; keyring and secret-service still need zbus 5" },
]

[licenses]
# Compatible with the project's MIT licence. MPL-2.0 joins only if a dependency forces it.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []
# The allow list is set for the whole planned dependency tree, so entries that no
# current crate uses are expected until milestone 1 lands.
unused-allowed-license = "allow"

[licenses.private]
# Workspace members are never published; their licence is the workspace one.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version; cargo-deny accepts them because every
# member is publish = false.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # No workspace crate may use log; these third-party crates may depend on it.
  # Extend the list when a new dependency needs it, never with a workspace crate.
  { crate = "log", wrappers = ["reqwest", "rustls-platform-verifier", "keyring-core", "rusqlite_migration", "wiremock"], reason = "tracing is the only logging facade" },
  { crate = "openssl-sys", reason = "TLS is rustls only" },
  { crate = "native-tls", reason = "TLS is rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The libghostty-vt pin (docs/ghostty-pin.md), used only by efr-screen-ghostty.
allow-git = ["https://github.com/uzaaft/libghostty-rs"]
