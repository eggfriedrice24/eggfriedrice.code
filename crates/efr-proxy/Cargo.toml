[package]
name = "efr-proxy"
description = "The network proxy of the efr sandbox: one listener per contained call, the allow list, the address guard, the SNI check and the upload budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
efr-permissions.workspace = true
efr-protocol.workspace = true
efr-stdx.workspace = true
# getifaddrs for the host's own addresses and their netmasks (the address guard). The
# feature adds no crate: it turns on `socket`, which the workspace has already.
nix = { workspace = true, features = ["net"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
efr-test-support.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
# Real ClientHello bytes from rustls::ClientConnection, written into a Vec: no server
# and no network.
rustls.workspace = true
tempfile.workspace = true
# The debug line of a call's close, read in a test.
tracing-subscriber.workspace = true

[lints]
workspace = true
