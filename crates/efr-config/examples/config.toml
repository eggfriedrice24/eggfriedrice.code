#:schema https://raw.githubusercontent.com/eggfriedrice24/eggfriedrice.code/main/docs/config.schema.json

# The efr config file, read by efrd and efr from $XDG_CONFIG_HOME/efr/config.toml
# (EFR_CONFIG_DIR or EFR_HOME moves it; efr paths shows where). Every key is optional:
# a key that is left out has the value of its commented line, or none when the comment
# says so. An unknown key is an error, so a typo never silently does nothing. The file
# holds no secrets, so it can live in a dotfiles repository behind a symbolic link.
# efrd reads it again when it changes; a file with an error keeps the old settings. A
# key marked (restart) applies only after efrd restarts. efr config check checks it.

# The daemon's tracing filter, in EnvFilter syntax. EFR_LOG and efrd --log win over
# it.
# log = "info"

# The screen backend of the hidden shells: auto (ghostty when the build has it, else
# vt100), vt100 or ghostty. EFR_SCREEN and efrd --screen win over it. (restart)
# screen = "auto"

[model]
# The provider of new conversations: openai-subscription (the ChatGPT plan, after
# efr login openai) or openai-api (an API key). (restart)
# provider = "openai-subscription"

# The default model of a turn. Unset: the first of openai.models, else gpt-5.5. A
# prompt may choose another one for its turn.
# name = "gpt-5.5"

# The default reasoning effort, such as low, medium or high. Unset: the backend's own
# default for the model. A prompt may choose another one for its turn.
# effort = "medium"

# The system prompt of every request. Unset: efr's own, which tells the model how it
# runs commands and what the permission policy does.
# system_prompt = "You are efr, a coding and system assistant in the user's terminal."

# The most tokens one model call may produce, from 1 to 1000000. Unset: the
# provider's default.
# max_output_tokens = 32000

[openai]
# The originator of the subscription login and of every subscription request.
# (restart)
# originator = "efr"

# Models added to the built-in model list, such as a new model before efr knows it.
# A prompt may then name them; their efforts are not checked. An entry is a model id,
# or a table that also gives the model's context window (1000 to 100000000 tokens) and
# its output limit (1 to 1000000 tokens, below the window). A table may name a
# built-in model to change its limits.
# models = ["gpt-5.4", { id = "gpt-next", context_window = 400000, max_output_tokens = 128000 }]

# Replaces the subscription backend's base URL. Unset: the ChatGPT backend. (restart)
# subscription_base_url = "https://chatgpt.com/backend-api/codex"

# Replaces the public API's base URL. Unset: api.openai.com. (restart)
# api_base_url = "https://api.openai.com/v1"

[permissions]
# The default permission mode of a turn: manual (every call asks, except what your
# rules allow), cautious (read-only commands and reads run at once) or auto (cautious
# plus writes, builds and tests in the project). A prompt may choose another one for
# its turn. A turn from the phone runs with at most cautious. docs/permissions.md
# lists what each mode allows.
# mode = "cautious"

# Files and directories that count as secrets on top of the built-in ones, so the model
# may never read or write them: absolute, or below the home directory as ~/...
# secret_paths = ["~/.config/rclone/rclone.conf"]

# Your rules, after the built-in ones; the last rule that matches wins. Each has an
# action (any, read, write, execute, network), a resource (any, project, a class, a
# path under, or a command) and an effect (allow, ask, deny). docs/permissions.md
# explains them.
# [[permissions.rules]]
# action = "execute"
# resource = { command = { program = "cargo", args = ["test"] } }
# effect = "allow"

[shell]
# The hidden shell, an absolute path. Unset: zsh on the PATH.
# program = "/usr/bin/zsh"

# Start the hidden shell as a login shell.
# login = true

# Minutes without output or input, at a prompt and unwatched, before a hidden shell is
# closed, up to a year; 0 keeps idle shells.
# idle_minutes = 60

# keep leaves sudo's credential cache to sudo (5 minutes by default); per_call makes
# the hidden shell forget sudo's and doas's credentials after each call, so the next
# sudo asks for the password again. Every sudo call asks for approval with either
# value.
# sudo_cache = "keep"

# The longest a command that you approved because it may wait for input at the
# terminal (sudo, ssh) runs before its call answers the model, in minutes from 1 to
# 1440 (a day), while a terminal that can type answers follows the conversation; the
# model's own timeout holds without one.
# interactive_timeout_minutes = 60

[conversation]
# The most prompts that may wait behind a running turn, from 1 to 1024.
# max_queued = 16

# Seconds an approval request waits before it expires, up to a week. Unset: it waits
# until you answer.
# approval_timeout_secs = 600

# The shortest time between two streamed text updates in the log, in milliseconds, up
# to 60000. Live clients see the text sooner, through drafts.
# update_interval_ms = 200

# The shortest time between two drafts of a running turn, in milliseconds, up to
# 1000: the text, the reasoning and the tool input that a terminal shows as they
# arrive. Drafts go only to live clients and never into the log; 0 sends every change.
# draft_interval_ms = 16

# Hours without activity after which a terminal's next , line starts a new
# conversation, up to a year; 0 continues the old one forever.
# tty_idle_hours = 12

[compaction]
# true compacts a conversation's context on its own when it reaches auto_at, before a
# model call, and the turn goes on. false compacts only when you run ,compact (efr
# compact), and a request that does not fit in the model's window fails the turn.
# auto = true

# The percent of the model's context window at which efr compacts on its own, from 1
# to 99. ctx 100% in the status row means this point.
# auto_at = 76

[sandbox]
# false makes the auto mode unavailable: its turns run as cautious.
# enabled = true

# The bubblewrap program, an absolute path. Unset: the first bwrap on the daemon's
# PATH. A change runs the sandbox probe again.
# bwrap = "/usr/bin/bwrap"

# Which registered projects a call may write: turn (the turn's project), named (also
# the registered projects that the command names) or all.
# write_projects = "named"

# More write roots for every call: absolute, or below the home directory as ~/... The
# floors (shell startup files, git hooks, efr's config) stay read-only inside them.
# The home directory itself is refused.
# write_roots = ["~/notes"]

# The tool caches that a call reads and writes through a private overlay: absolute, or
# ~/... A cache that does not exist is skipped.
# caches = ["~/.cargo", "~/.rustup", "~/.cache", "~/go/pkg/mod", "~/.npm", "~/.bun/install/cache", "~/.local/share/pnpm/store", "~/.m2/repository", "~/.gradle/caches"]

# How the caches are mounted: overlay (a private upper layer per conversation), tmp
# (writes vanish after each call) or readonly. tmp is the default because the overlays
# failed the launch gate of phase 1 (slow setups).
# cache_mode = "tmp"

# Days without a call after which a conversation's cache layers are deleted, from 1
# to 3650.
# cache_days = 14

# The size of all cache layers together, in GiB, from 1 to 10000; the oldest
# conversation's layers go first.
# cache_max_gib = 20

# More paths that a call reads as empty: absolute, or ~/... In auto, a read_file of
# them asks.
# mask = ["~/.config/private"]

# Names masked inside each write root, to depth 3: * matches any text, and a leading !
# keeps a name readable.
# mask_globs = [".env", ".env.*", "!.env.example", "!.env.sample", "!.env.template"]

# More paths that stay read-only even inside a write root: absolute, or ~/...
# protect = ["~/p/app/deploy"]

# More environment variables removed from every call: names, or patterns with *.
# env_deny = ["MY_*"]

# Variables that the scrub of secret-like names keeps: names, or patterns with *.
# env_keep = ["AWS_REGION"]

# The exported variables that return from a call to the hidden shell: names, or
# patterns with *. PATH, LD_* and the other names of the built-in never list never
# return.
# promote_env = ["RUST_LOG", "RUST_BACKTRACE", "NODE_ENV", "DEBUG", "CI", "NO_COLOR", "FORCE_COLOR", "TZ", "LANG", "LC_*"]

# More names that never return to the hidden shell: names, or patterns with *.
# export_deny = ["MY_TOOL_*"]

# Folders that a sync service copies off the machine: absolute, or ~/... A write to
# them is an exit that only you can approve.
# synced_dirs = ["~/Dropbox", "~/Nextcloud", "~/Sync", "~/OneDrive", "~/MEGA"]

# The files that run code later outside the sandbox: names or paths relative to a
# write root, with *. The end of an auto turn lists the ones it changed.
# surface_files = ["Makefile", "build.rs", "package.json", ".envrc", "rust-toolchain.toml", "justfile", "*.mk", "CMakeLists.txt", "setup.py", "pyproject.toml", "conftest.py", ".vscode/tasks.json", ".nvim.lua", ".exrc", ".mise.toml", ".tool-versions", "flake.nix", ".pre-commit-config.yaml", ".cargo/config.toml", ".cargo/config", ".npmrc", ".yarnrc.yml", ".pnpmfile.cjs"]

# Tell package managers to work offline while the sandbox has no network
# (CARGO_NET_OFFLINE, npm_config_offline, UV_OFFLINE, GOPROXY=off).
# offline_hints = true

# Directory names whose deletion is not destructive, because builds make them again.
# rebuildable = ["target", "node_modules", "dist", "build", ".venv"]

[snapshot]
# efr takes its own snapshot of the turn's registered project, $SCRATCH and, in auto,
# the registered projects that a line names, before and after each call that can
# write, in its data directory. It never touches the project's .git or its index.
# false takes no snapshot: a shell call and the end of a turn then list no changed
# files, and efr diff has nothing new. A file tool still shows its diff.
# enabled = true

# Files above this size in MiB are left out of a snapshot, from 1 to 1024: a new
# untracked file, and a file that grows past it, which then shows as changed with no
# line counts.
# max_file_mib = 10

# Which ignored files a snapshot takes: none, or small (up to 1 MiB each, outside
# build and dependency directories such as target and node_modules, so .env is
# kept).
# ignored = "small"

# A project or $SCRATCH with more files than this is not snapshotted, from 100 to
# 1000000; the debug log says so, and efr counts its files again after 10 minutes.
# max_files = 20000

# The turns of each conversation whose snapshots stay, newest first; older ones are
# deleted.
# keep_turns = 50

# Days without a snapshot after which the store of a project or $SCRATCH is deleted.
# max_age_days = 30

[render]
# The colour theme of code blocks and diffs, such as catppuccin-mocha, gruvbox-dark or
# nord. Unset: the terminal's own 16 colours. "auto" takes theme_dark or theme_light,
# as the terminal's background is dark or light: the zsh plugin asks the terminal once
# when it loads and sets EFR_TERMINAL_BG to dark or light. A code_theme in the palette
# file wins over it. Only efr reads it.
# theme = "catppuccin-mocha"

# The theme that theme = "auto" takes on a dark background, and when the background is
# not known.
# theme_dark = "catppuccin-mocha"

# The theme that theme = "auto" takes on a light background.
# theme_light = "catppuccin-latte"

# A theme file: a [colors] table with the keys of [render.colors] below and, as
# code_theme, the path of a .tmTheme file for code (absolute, ~/... or relative to
# the theme file). palette must be an absolute path or start with ~/. Unset: no theme
# file.
# palette = "~/.config/efr/theme.toml"

# Motion in the status row of a running turn: the spinner turns and a band in the text
# role moves over the state in the muted role. false shows a still dot and no band;
# the time still counts.
# motion = true

# One muted line at the end of each turn: how long it took and the tokens it used,
# such as "done in 42s, 18.2k tokens in, 1.1k out".
# turn_summary = true

# The lines of a file tool's diff that a call shows after it ran, from 0 to 1000; a
# muted line then says how many more there are. 0 shows no diff. efr diff shows all
# of a turn's diff.
# diff_lines = 20

# The progress bar of the terminal's tab (OSC 9;4) while a turn runs: auto (only in
# Ghostty 1.2 or later, kitty 0.47 or later and Windows Terminal, never inside tmux,
# GNU screen or zellij), on or off.
# progress = "auto"

# An input row below the status row while a turn runs, when the terminal is
# interactive. Enter steers the turn, Tab queues a prompt behind it and Esc interrupts
# it. false shows no input row: keys typed during a turn go to the shell's next prompt.
# turn_input = true

[render.colors]
# The colour of each role: "#rrggbb", an ANSI slot from 0 to 15, or one of the 16
# names, such as "yellow" or "bright-blue". A role set here wins over the palette file,
# and the palette file wins over the terminal's 16 colours. Without truecolor, "#rrggbb"
# shows as the nearest of the 16 colours; with NO_COLOR, no colour shows.

# Prose and plain lines. Unset: the terminal's own foreground.
# text = "#e8e2d4"

# Notes, tool call lines, labels, rules and the end-of-turn line. Unset: dim.
# muted = 8

# The spinner and the colour of headings. Unset: 3, the terminal's yellow.
# accent = "yellow"

# Headings of level 1 and 2. Unset: the accent colour.
# heading = "bright-yellow"

# Links, which are also underlined. Unset: 4, the terminal's blue.
# link = "blue"

# Inline code. Unset: 6, the terminal's cyan.
# code = "cyan"

# Done task boxes and good news. Unset: 2, the terminal's green.
# success = "green"

# Questions and refusals, which are also bold. Unset: 3, the terminal's yellow.
# warning = "#e8a33d"

# Failures, such as a failed exit code. Unset: 1, the terminal's red.
# error = "red"

# The text of a quote, which is also italic. Unset: the terminal's own foreground.
# quote = 7

[render.colors.diff]
# Added lines of a diff. Unset: 2, the terminal's green.
# add = "green"

# Removed lines of a diff. Unset: 1, the terminal's red.
# remove = "red"

# Hunk headers of a diff. Unset: 6, the terminal's cyan.
# hunk = "cyan"
