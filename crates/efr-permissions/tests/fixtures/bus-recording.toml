# The bus calls of the read forms of the filtered bus (phase E), recorded with the
# recording relay of the phase E probe: each tool ran in bwrap with only the relay's
# sockets as the system and the session bus. Every tool first sends
# org.freedesktop.DBus.Hello to the bus driver; the proxy answers it itself, so it is
# not listed.
#
# `bus_defaults_match_the_recording` (src/bus/tests.rs) checks this file against
# DEFAULT_RULES in src/bus.rs, both ways:
#
# - [[call]]: one recorded call. `allow = true` means that the defaults of its bus must
#   let it through; `allow = false` means that they must refuse it, and `why` says why.
# - [[kept]]: a default rule that no recorded call uses, with the reason it is in the
#   defaults. Every default rule must match an allowed call or be listed here.
#
# `systemd` is the systemd version of the recording. The systemd 255 rows (Ubuntu 24.04,
# the CI image) come from the first CI run of the build branch.

[[call]]
tool = "hostnamectl"
systemd = 262
bus = "system"
name = "org.freedesktop.hostname1"
member = "org.freedesktop.DBus.Properties.GetAll"
path = "/org/freedesktop/hostname1"
allow = true

