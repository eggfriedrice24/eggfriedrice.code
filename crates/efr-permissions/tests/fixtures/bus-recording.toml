# notify-send of libnotify 0.8.8 (v0.0.4, DV18), recorded on a private session bus with
# the fake services of efr-daemon's bus filter tests. The proxy sends each call to the
# name's owner; the rows give the name. `-e` (a transient notification) also asks for
# the capabilities.
[[call]]
tool = "notify-send hi there"
systemd = 262
bus = "session"
name = "org.freedesktop.Notifications"
member = "org.freedesktop.Notifications.GetServerInformation"
path = "/org/freedesktop/Notifications"
allow = true

