# The 110 lines of the command and attack corpus (research/auto-corpus.md), with the
# phase 1 column of spec Appendix A. `efr-permissions` runs each line through the engine
# in `tests/it/corpus.rs`, and `efr-tools` checks that its shell tool declares what each
# line declares here.
#
# The machine: the home directory is /home/u; the turn's project is ~/p/efr, where the
# line runs; ~/p/app and ~/p/project-x are registered projects; the envelope roots are
# /tmp, /var/tmp, /dev/shm, the cache overlays (~/.cargo, ~/.rustup, ~/.cache,
# ~/go/pkg/mod, ~/.npm) and the registered projects; ~/Dropbox is a synced folder;
# efr's config is ~/.config/efr.
#
# Keys of a line:
#   n           the line number in the corpus; a line with alternatives has one entry each
#   line        the command line, or `settings` for the settings tool (line 97)
#   p1          the phase 1 column of Appendix A: R routine, C contained, X(kind) an exit
#               that asks, U(kind) an exit that only the user may approve, D a floor
#   engine      the result when the engine is stricter than p1, with `note` saying why
#   exits       every exit kind that the engine predicts, in any order
#   reads, trees, writes, network, interactive
#               what the shell tool declares for the line
#   missing, dirs, files, tracked
#               the facts that the daemon collects: paths that do not exist, that are
#               directories or files, and the tracked files below a directory

