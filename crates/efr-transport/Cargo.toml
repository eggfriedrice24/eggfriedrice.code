[package]
name = "efr-transport"
description = "Both sides of the efr protocol's transport: the daemon's edge (the frame codec, the 0600 Unix listener, the request-id table, bounded subscriptions, hello and the Dispatcher trait) and the client (daemon discovery, the connection, calls, streams and cancellation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
bytes.workspace = true
efr-protocol.workspace = true
efr-stdx.workspace = true
futures.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# A frame can carry a password typed for input.respond: the server zeroes its bytes
# once it is decoded, and the client zeroes the buffers of the request frames.
zeroize.workspace = true

[dev-dependencies]
jiff.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

