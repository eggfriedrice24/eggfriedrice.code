[package]
name = "efr-scope"
description = "Scope derivation for efr: the project registry, guarded git discovery and dotfiles detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
efr-protocol.workspace = true
efr-stdx.workspace = true
serde.workspace = true
thiserror.workspace = true
# For the type of the git command that efr-stdx builds, and for spawn_blocking, which
# keeps every look at the file system off the async workers.
tokio.workspace = true
toml.workspace = true
# The changes of `efr project add` and `remove`, which keep the comments of the file.
toml_edit.workspace = true

[dev-dependencies]
jiff.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
