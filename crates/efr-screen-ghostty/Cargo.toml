[package]
name = "efr-screen-ghostty"
description = "The libghostty-vt screen backend for efr: the only crate that links Zig output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
efr-screen.workspace = true
libghostty-vt.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
# The widths test checks efr-render's count of grapheme widths against the real screen.
efr-render.workspace = true
# The conformance feature turns on efr_screen::conformance for the test targets only.
efr-screen = { workspace = true, features = ["conformance"] }
# The bench of the capture screens reports through the shared bench helpers.
efr-test-support.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
