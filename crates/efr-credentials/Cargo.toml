[package]
name = "efr-credentials"
description = "Vendor-neutral credential storage for efr: the SecretStore trait, 0600 files and an optional keyring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
doctest = false

[features]
# The platform keyring (Secret Service on Linux). Off by default: open question 14 in
# the structure document decides whether it can ever replace the 0600 files.
keyring = ["dep:keyring"]

[dependencies]
efr-stdx.workspace = true
jiff.workspace = true
keyring = { workspace = true, optional = true }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
