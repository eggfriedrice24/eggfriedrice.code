# The pnpm settings of the app. The app is one package outside the Cargo workspace, so
# this file names no other packages. pnpm 11 keeps its safe defaults (minimumReleaseAge,
# strictDepBuilds, blockExoticSubdeps). Only the packages in allowBuilds can run their
# install scripts.
allowBuilds:
  # Its postinstall downloads the tree-sitter runtime (SHA-256 checked) and the grammar
  # sources from npm for code highlighting. Math is off in package.json, so it downloads
  # no RaTeX.
  react-native-enriched-markdown: true
  # jest-haste-map needs it. The prebuilt binary comes as an optional dependency, and
  # the script only builds it from source when the binary is missing.
  "@parcel/watcher": false
  # jest-resolve needs it. The prebuilt binding comes as an optional dependency, and the
  # script only downloads one when the binding is missing.
  unrs-resolver: false
  # eas-cli brings them. dtrace-provider builds an optional DTrace probe that the CLI
  # does not need, and the script of protobufjs only prints a notice.
  dtrace-provider: false
  protobufjs: false
# jest-expo brings jsdom, and pnpm then links it as the optional peer of vitest. The
# types of vitest/config import "jsdom", and TypeScript finds the hoisted @types/jsdom,
# which loads the DOM lib into the program of the app. Do not hoist it.
hoistPattern:
  - "*"
  - "!@types/jsdom"
# react-native-menu 2.0.0 imports "RCTBridge.h" with quotes, and React Native 0.88 has
# the header only as <React/RCTBridge.h>, so the iOS build fails. The patch changes only
# that import (t3code does the same since its move to SDK 58). Drop it with the next
# release of the package that has the fix.
# react-native-enriched-markdown 1.1.1 on iOS gives text with more than one line the full
# max width. In the horizontal ScrollView of our code block frame, that width is
# infinite, so the fence body draws no text. The patch is upstream PR #1017 (issue #990,
# merged 2026-10-16): only soft-wrapped text takes the max width. It leaves out the
# `subtractExtraLineFragment` argument of #885, which 1.1.1 does not have. Drop it with
# the first release after 1.1.1 (1.2.0 has the fix).
patchedDependencies:
  "@react-native-menu/menu@2.0.0": patches/@react-native-menu__menu@2.0.0.patch
  react-native-enriched-markdown@1.1.1: patches/react-native-enriched-markdown@1.1.1.patch
# eas-cli 25.3.0 reads app.config.ts through @expo/config 55, whose @expo/require-utils
# 55.0.8 asks for TypeScript 5 as an optional peer. The app pins TypeScript 7.0.2. It is
# safe: that package finds no transpileModule in TypeScript 7 and then strips the types
# with its own transform, and eas-cli loaded app.config.ts so for the EAS builds of the
# app. The rule covers only that one package and that one peer.
peerDependencyRules:
  allowedVersions:
    "@expo/require-utils@55>typescript": "7"
