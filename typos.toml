[files]
# The subscribe recordings of the phone app cut words into drafts at any character. The
# decode bench of the app holds the same lines in app/src/lib/dev/recordings.ts. The
# frames of the terminal design cut a word where the band of the status row starts. The
# recorded answers of a provider cut the text into deltas at any character too.
extend-exclude = [
  "target/",
  "*.snap",
  "Cargo.lock",
  "app/test/recordings/*.ndjson",
  "app/src/lib/dev/recordings.ts",
  "crates/efr-test-support/fixtures/design/*.jsonl",
  "crates/efr-providers/fixtures/*/*/*_recorded.sse",
]

[default]
# Commit hashes (ghostty 7bb45ba, helix ba40e547, ...) are not words.
# A line that ends in `spellchecker:disable-line` holds a typo on purpose, such as a
# test of the "did you mean" hint.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b", "(?Rm)^.*spellchecker:disable-line$"]

[default.extend-words]
# OpenSSL's option `-passin`, which the redaction of the last command knows.
passin = "passin"
# systemd-localed, the locale service (`org.freedesktop.locale1`) of the bus filter.
localed = "localed"
